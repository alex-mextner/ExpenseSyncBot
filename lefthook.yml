pre-commit:
  parallel: true
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" pre-commit'
    typecheck:
      run: bun run type-check
    lint:
      run: node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx}"

pre-push:
  parallel: true
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" pre-push'
    tests:
      # The full suite never runs on the shared workstation (CLAUDE.md § Heavy work runs on
      # the server): where server-run is installed the push waits for the server run; elsewhere local.
      # Absolute path: a GUI/IDE git has no ~/.local/bin on PATH, and a silent local fallback
      # on that machine is the overload this exists to prevent.
      run: r="$HOME/.agents/skills/server-offload/server-run"; [ -x "$r" ] || r=$(command -v server-run); if [ -n "$r" ]; then "$r" -- bun run test; else bun run test; fi
commit-msg:
  commands:
    global-git-hooks-dispatcher:
      run: '"${XDG_CONFIG_HOME:-$HOME/.config}/git/run-global-hooks" commit-msg {1}'
