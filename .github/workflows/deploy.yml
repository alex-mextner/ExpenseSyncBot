name: Deploy to Digital Ocean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install
      - run: bun run type-check
      - run: bun run lint
      - name: Run tests
        run: bun run test
      - name: Build Mini App
        run: cd miniapp && bun install --frozen-lockfile && bun run build

  deploy:
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via git pull
        uses: appleboy/ssh-action@v1
        with:
          host: 104.248.84.190
          username: www-data
          key: ${{ secrets.DIGITAL_OCEAN_SSH_KEY }}
          script: |
            set -e
            cd /var/www/ExpenseSyncBot
            export PATH="/var/www/.nvm/versions/node/v22.17.0/bin:/var/www/.bun/bin:$PATH"

            echo "📥 Pulling latest changes..."
            git remote prune origin
            git pull origin main
            git submodule update --init

            echo "📦 Installing dependencies..."
            /var/www/.bun/bin/bun install

            echo "📦 Installing ZenPlugins dependencies..."
            /var/www/.bun/bin/bun install --cwd src/services/bank/ZenPlugins

            echo "🏗️ Building Mini App..."
            cd miniapp
            /var/www/.bun/bin/bun install --frozen-lockfile
            /var/www/.bun/bin/bun run build
            cd ..

            echo "🔧 Making start script executable..."
            chmod +x start.sh

            echo "📜 Rotating logs before restart..."
            STAMP=$(date +%Y-%m-%d_%H-%M-%S)
            cd logs
            for f in error.log out.log healthcheck.log; do
              if [ -s "$f" ]; then
                mv "$f" "${f%.log}_${STAMP}.log"
                gzip "${f%.log}_${STAMP}.log"
              fi
            done
            cd ..

            echo "🔄 Reloading Caddy..."
            caddy reload --config /etc/caddy/Caddyfile

            # ── Blue-green zero-downtime deploy ──────────────────────────────
            # Caddy always has localhost:3311 + localhost:3312 with lb_policy first.
            # Green (3312) signals blue (3311) to stop polling via polling-handoff.
            # No 409 Conflict: handoff ensures only one poller at a time.
            BUN=/var/www/.bun/bin/bun
            PM2=/var/www/.bun/bin/pm2

            # Remove stale green from a previous failed deploy
            $PM2 delete esb-green 2>/dev/null || true

            # Start green on 3312 — acquirePolling will signal blue to stop polling
            echo "Starting green process on port 3312..."
            OAUTH_SERVER_PORT=3312 $PM2 start ./start.sh \
              --name esb-green \
              --cwd /var/www/ExpenseSyncBot \
              --no-autorestart \
              --log /var/www/ExpenseSyncBot/logs/green-out.log

            # Wait up to 90s for green /health (bot start + handoff takes ~10-30s)
            echo "Waiting for green /health on 3312..."
            for i in $(seq 1 30); do
              curl -sf http://localhost:3312/health 2>/dev/null && { echo "  Green healthy."; break; }
              [ $i -eq 30 ] && {
                echo "ERROR: green did not become healthy." >&2
                $PM2 delete esb-green 2>/dev/null || true
                exit 1
              }
              sleep 3
            done

            # Reload blue — sequential: SIGTERM old (stopPolling+DB close) → start new on 3311.
            # New blue's acquirePolling signals green to stop, then starts polling on 3311.
            echo "Reloading blue (expensesyncbot) on 3311..."
            $PM2 reload ecosystem.config.cjs --update-env

            # Wait up to 90s for blue /health on 3311
            echo "Waiting for blue /health on 3311..."
            for i in $(seq 1 30); do
              curl -sf http://localhost:3311/health 2>/dev/null && { echo "  Blue healthy."; break; }
              [ $i -eq 30 ] && { echo "ERROR: blue did not become healthy." >&2; exit 1; }
              sleep 3
            done

            # Remove green (already stopped polling, just needs process cleanup)
            $PM2 delete esb-green 2>/dev/null || true

            echo "✅ Deployment completed successfully!"

            echo "📊 PM2 status:"
            /var/www/.bun/bin/pm2 list

      - name: Notify deploy success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.BOT_ADMIN_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          TEXT=$(printf '✅ <b>Deployed</b> <code>%s</code>\n%s' "${COMMIT_SHA:0:7}" "$FIRST_LINE")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$ADMIN_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML"}')"

  notify-failure:
    name: Notify on failure
    needs: [check, deploy]
    if: always() && (needs.check.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.BOT_ADMIN_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          TEXT=$(printf '❌ <b>Deploy failed</b> <code>%s</code>\n%s\n\n<a href="%s">View run</a>' "${COMMIT_SHA:0:7}" "$FIRST_LINE" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$ADMIN_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
