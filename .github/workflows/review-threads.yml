# Merge gate: block the PR while it has UNRESOLVED review threads.
#
# GitHub's native equivalent is the branch-protection toggle "Require conversation
# resolution before merging" — but that's admin-only and can't be set from inside the repo.
# This workflow gives you the same gate as a required STATUS CHECK that any maintainer can
# add to branch protection (Settings -> Branches -> required checks -> "review-threads").
#
# INSTALL: copy to .github/workflows/review-threads.yml AND keep the gate script at
# ci/review-threads/review-threads.sh AND its sibling review_threads.py (the launcher execs
# it; vendor the ci/ dir, or copy both files and adjust the run: path). To make it a HARD block, add the check "review-threads" to branch
# protection (admin-only, one-time).
#
# TAMPER-RESISTANCE — why `pull_request_target` AND a pinned base checkout:
#   A merge-BLOCKING gate must not run a script the PR itself can edit (a PR could weaken the
#   very gate it has to pass). Under `pull_request_target` the BASE-branch (trusted) copy of
#   this workflow runs and the default checkout is the base branch. The review/comment
#   triggers below ALSO run the trusted DEFAULT-branch copy of THIS workflow file — BUT their
#   default checkout ref is the PR MERGE ref (refs/pull/N/merge), which CONTAINS the PR's
#   edits to the gate script. So the checkout step pins `ref` to the PR BASE branch (trusted)
#   for every trigger, guaranteeing the base copy of review-threads.sh runs, never the PR's.
#   The job reads ONLY the PR NUMBER from the event payload; it never checks out or executes
#   PR-head code, and `permissions` stay read-only.
#   Caveat: like any base-run gate, it does NOT run on the PR that first introduces it.
#
# RE-EVALUATION — closing the stale-green gap (agent-tools#65):
#   `pull_request_target` alone only fires on PR lifecycle (open/synchronize/...), so a review
#   thread ADDED AFTER an earlier green check left the required `review-threads` status
#   DISHONESTLY green — a PR could be merged via the GitHub UI over a fresh unresolved thread
#   (the ship gate re-checks at merge time, but the required STATUS lied). We now also re-run
#   when a review is submitted or a review comment is created/edited/deleted — i.e. exactly
#   when an unresolved thread APPEARS — so the gate re-counts and reds the check. WHY the
#   re-run actually updates the required status: both events run on the PR MERGE ref
#   (GITHUB_REF = refs/pull/N/merge per the GitHub Actions event docs), exactly like
#   `pull_request` — so GitHub attaches their check-run to the PR and branch protection's
#   required `review-threads` context is refreshed on the PR head. (Contrast `issue_comment`,
#   which runs on the DEFAULT-branch SHA and therefore can't — see the exclusions below.)
#
#   Deliberately NOT triggered on (each would be a false-coverage no-op here):
#     • `issue_comment` — runs on the DEFAULT-branch SHA, so its check-run does NOT attach to
#       the PR head where branch protection looks; it would re-run but never update the
#       required status. (A plain PR comment also doesn't change thread state.)
#     • `pull_request_review_thread` (resolved/unresolved) — NOT a supported Actions trigger
#       (only a webhook event), so listing it would silently never fire.
#   Residual gap (the SAFE direction): RESOLVING the last thread fires no supported Actions
#   trigger, so the check won't auto-flip back to green on its own — push a commit, re-run via
#   `workflow_dispatch`, or rely on the ship-time preflight in ci/ship. Staying red until then
#   is conservative: it never lets an unresolved thread merge, it only delays the green.

name: review-threads

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # A new review / review comment is exactly when an unresolved thread appears AFTER an
  # earlier green check — re-run so the required status can't stay stale-green (#65).
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-check (required — manual runs have no PR in the event payload)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A single review submit can fan out into a pull_request_review (submitted) event PLUS one
  # or more pull_request_review_comment (created) events for its inline comments — each its
  # own run + GraphQL call. Coalesce per PR and cancel superseded runs: safe because every run
  # re-queries LIVE thread state, so the surviving (latest) run always reports the truthful
  # status. Falls back to run_id when no PR number is resolvable (each such run gets its own
  # group — no cancellation), so the key is always defined.
  group: review-threads-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-threads:
    name: review-threads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted BASE-branch gate script
        # Pin `ref` to the PR's BASE branch (trusted) — NEVER the default ref. Under
        # pull_request_target the default is already base, but under pull_request_review /
        # pull_request_review_comment the default checkout ref is the PR MERGE ref
        # (refs/pull/N/merge), which CONTAINS the PR's edits to this very gate script. Pinning
        # to base.ref makes every trigger run the trusted base copy of review-threads.sh,
        # preserving the tamper-resistance of pull_request_target. base.ref is the PR base
        # branch (an attacker can't push to it via a PR); on a manual workflow_dispatch it's
        # empty, so checkout falls back to the default branch (also trusted). Do NOT use
        # head.ref/head.sha/merge here — that would run PR-controlled code.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Fail on unresolved review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR number: every pull_request-family event (pull_request_target,
          # pull_request_review, pull_request_review_comment) carries
          # github.event.pull_request.number; a manual run falls back to the required input.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: bash ci/review-threads/review-threads.sh
